{% extends "base.html" %}

{% block title %}Login - LoanMaster{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card-custom p-4">
                <div class="text-center mb-4">
                    <i class="fas fa-coins" style="color: #D4AF37; font-size: 3rem;"></i>
                    <h3 style="color: #0A6E4A;">Welcome Back!</h3>
                    <p class="text-muted">Login to your LoanMaster account</p>
                </div>
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" class="form-control" name="username" required 
                               placeholder="Enter your username" style="border-radius: 10px; border: 2px solid #D4AF37;">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control" name="password" required 
                               placeholder="Enter your password" style="border-radius: 10px; border: 2px solid #D4AF37;">
                    </div>
                    <button type="submit" class="btn btn-custom w-100">
                        <i class="fas fa-sign-in-alt me-2"></i>Login
                    </button>
                </form>
                <div class="text-center mt-3">
                    <p>Don't have an account? <a href="{{ url_for('register') }}" style="color: #D4AF37;">Register</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
